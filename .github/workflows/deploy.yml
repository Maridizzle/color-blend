# Build the game and publish it to GitHub Pages.
#
# Deploys on every push to the default branch. The Vite build uses a relative
# base, so the output works unchanged at a project-site URL
# (https://<user>.github.io/color-blend/) with nothing to configure.
#
# One-time setup: Settings -> Pages -> Source -> "GitHub Actions". The
# configure-pages step below tries to do that automatically, but the setting
# can also be flipped by hand. GitHub Pages is only available for private
# repositories on a paid plan; on the free plan the repository has to be
# public.

name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/color-matching-art-game-yyeafy
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it midway, but never run
# two at once.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        # Playwright is only needed by the local browser check in tools/, not
        # by anything here, so skip fetching a browser that will go unused.
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
        run: npm ci

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
