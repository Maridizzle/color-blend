# Build the game, and publish it to GitHub Pages once Pages is switched on.
#
# Deploys on every push to the default branch. The Vite build uses a relative
# base, so the output works unchanged at a project-site URL
# (https://<user>.github.io/color-blend/) with nothing to configure.
#
# One-time setup: Settings -> Pages -> Source -> "GitHub Actions". Creating a
# Pages site needs more permission than a workflow token carries, so it cannot
# be done from here. Until it is done, this workflow still builds and tests as
# normal and leaves a warning saying the deploy was skipped, rather than
# failing every push over a setting.
#
# GitHub Pages is only available for private repositories on a paid plan; on
# the free plan the repository has to be public.

name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/color-matching-art-game-yyeafy
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it midway, but never run
# two at once.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # One job rather than build/deploy, so the built site never has to be handed
  # between jobs just to be uploaded.
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        # Playwright is only needed by the local browser check in tools/, not
        # by anything here, so skip fetching a browser that will go unused.
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
        run: npm ci

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # Allowed to fail: it fails when no Pages site exists yet, which is a
      # setting nobody has flipped rather than anything wrong with the build.
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
        continue-on-error: true

      - name: Report that Pages is not enabled
        if: steps.pages.outcome != 'success'
        run: |
          echo "::warning title=Deploy skipped::GitHub Pages is not enabled for this repository, so the built game was not published. Enable it under Settings -> Pages -> Source -> 'GitHub Actions', then re-run this workflow. Pages requires a public repository on the free plan. The build and tests above passed."

      - name: Upload site
        if: steps.pages.outcome == 'success'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy
        id: deployment
        if: steps.pages.outcome == 'success'
        uses: actions/deploy-pages@v4
